<!-- logo-icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="32" height="32" role="img" aria-label="Movie Search icon">
  <defs>
    <linearGradient id="gi" x1="0" x2="1">
      <stop offset="0" stop-color="#01b4e4"/>
      <stop offset="1" stop-color="#6a4bff"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="96" height="96" rx="18" fill="url(#gi)"/>

  <!-- inner dark circle -->
  <circle cx="44" cy="42" r="26" fill="#0f1724"/>

  <!-- play triangle -->
  <polygon points="39,30 57,42 39,54" fill="#fff" transform="translate(-2,0)"/>

  <!-- handle -->
  <rect x="60" y="62" width="20" height="6" rx="3" ry="3" transform="rotate(40 70 65)" fill="#0f1724"/>
</svg>
