<!-- movie-logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Movie Search Logo">
  <defs>
    <!-- Gradient from teal to violet -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01b4e4" />
      <stop offset="100%" stop-color="#6a4bff" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- outer circular film shape -->
  <circle cx="45" cy="45" r="32" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- film holes -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="45" cy="15" r="2.5"/>
    <circle cx="45" cy="75" r="2.5"/>
    <circle cx="15" cy="45" r="2.5"/>
    <circle cx="75" cy="45" r="2.5"/>
  </g>

  <!-- play triangle -->
  <polygon points="40,30 62,45 40,60" fill="#ffffff" opacity="0.95" />

  <!-- magnifier handle -->
  <rect x="65" y="65" width="28" height="8" rx="4" ry="4"
        transform="rotate(45 70 70)" fill="#0f1724" opacity="0.9" />
</svg>
